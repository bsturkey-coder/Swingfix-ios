name: iOS Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild \
            -project SwingFix/SwingFix.xcodeproj \
            -scheme SwingFix \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator'
            CODE_SIGNING_ALLOWED=NO \
            build
